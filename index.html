 const moving=Math.abs(progress-target)>.0001;
 if(moving)progress=reduced.matches?target:progress+(target-progress)*(1-Math.exp(-dt/950));
 view.x+=(pointer.x-view.x)*.06;view.y+=(pointer.y-view.y)*.06;
 if(!reduced.matches||moving||clock===0){clock=reduced.matches?0:time/1000;draw(progress,clock)}
}
resize();observer.observe(canvas);
function render(){const p=pages[current];document.getElementById('letter').innerHTML=`<p class="small chapter">${p.label}</p><h1>${p.title}</h1>${p.body.map(t=>`<p class="copy">${t}</p>`).join('')}<p class="signature">${p.sign}</p><div class="page-no">${String(current+1).padStart(2,'0')} / 05 &nbsp; · &nbsp; Para Kiomi, de Marko</div>`;
 document.getElementById('gardenTitle').textContent=p.garden;document.getElementById('gardenNote').textContent=p.note;
 document.getElementById('prev').disabled=current===0;document.getElementById('next').textContent=current===4?'Volver a florecer ↺':current===0?'Abre tu carta →':'Siguiente página →';
 document.getElementById('dots').innerHTML=pages.map((_,i)=>`<span class="dot ${i===current?'on':''}" aria-hidden="true"></span>`).join('');document.getElementById('dots').setAttribute('aria-label',`Página ${current+1} de 5`);target=current/4;
}
function turn(next){if(busy||next<0||next>4)return;busy=true;let letter=document.getElementById('letter'),direction=next>current?'turn-forward':'turn-back';letter.classList.add(direction);setTimeout(()=>{current=next;render()},reduced.matches?0:340);setTimeout(()=>{letter.classList.remove(direction);busy=false},reduced.matches?20:720)}
document.getElementById('next').addEventListener('click',()=>turn(current===4?0:current+1));document.getElementById('prev').addEventListener('click',()=>turn(current-1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();turn(Math.min(4,current+1))}if(e.key==='ArrowLeft'){e.preventDefault();turn(current-1)}});
let touch=null;document.querySelector('.book').addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});document.querySelector('.book').addEventListener('touchend',e=>{if(!touch)return;let dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)turn(current+(dx<0?1:-1));touch=null},{passive:true});
render();draw(0);requestAnimationFrame(frame);
</script>
